<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Modelos de Autos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h2 class="mb-0">
                Lista de Modelos de Autos
            </h2>

        </div>

        <div class="card-body">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Modelo</th>
                        <th>Precio</th>
                        <th>Marca</th>
                        <th>Temporada</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="producto : ${modelos}">

                        <td th:text="${producto.id}"></td>

                        <td th:text="${producto.modelo}"></td>

                        <td>
                            $
                            <span th:text="${producto.precio}"></span>
                        </td>

                        <td th:text="${producto.marca}"></td>

                        <td th:text="${producto.temporada}"></td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
