server:
  port: 8090

spring:
  application:
    name: zuul-server

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

# =====================================================================
# RUTEO DINÁMICO DE ZUUL
# Zuul descubre instancias activas de cada servicio vía Eureka
# y distribuye la carga entre ellas automáticamente (Ribbon).
# =====================================================================
zuul:
  routes:
    # Ruta 1: hacia product-service (descubrimiento dinámico por Eureka)
    productos:
      path: /api/productos/**
      serviceId: product-service
      stripPrefix: true

    # Ruta 2: hacia item-service (descubrimiento dinámico por Eureka)
    items:
      path: /api/items/**
      serviceId: item-service
      stripPrefix: true

    # Ruta 3: URL estática (ruteo directo sin Eureka)
    productos-directo:
      path: /api/directo/**
      url: http://localhost:8081
      stripPrefix: true

  ignoredPatterns: /eureka/**

# =====================================================================
# HYSTRIX: Circuit Breaker y protección contra latencia
# timeout global de 6 s para las rutas de Zuul.
# Los @HystrixCommand del ProxyController usan sus propios timeouts.
# =====================================================================
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 6000

# =====================================================================
# RIBBON: Balanceo de carga (round-robin entre instancias Eureka)
# =====================================================================
ribbon:
  ConnectTimeout: 3000
  ReadTimeout: 5000
  eureka:
    enabled: true

logging:
  level:
    com.autos.zuul: DEBUG
    com.netflix.zuul: INFO
