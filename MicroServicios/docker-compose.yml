version: "3.9"

services:

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    networks:
      - microservices

  itemdb:
    image: mysql:8
    container_name: itemdb
    restart: always
    environment:
      MYSQL_DATABASE: itemdb
      MYSQL_USER: item_user
      MYSQL_PASSWORD: item_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    volumes:
      - ./mysql-init/itemdb.sql:/docker-entrypoint-initdb.d/itemdb.sql
    networks:
      - microservices

  productdb:
    image: mysql:8
    container_name: productdb
    restart: always
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_USER: product_user
      MYSQL_PASSWORD: product_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    volumes:
      - ./mysql-init/productdb.sql:/docker-entrypoint-initdb.d/productdb.sql
    networks:
      - microservices

  item-service:
    build: ./item-service
    container_name: item-service
    depends_on:
      itemdb:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://itemdb:3306/itemdb
      SPRING_DATASOURCE_USERNAME: item_user
      SPRING_DATASOURCE_PASSWORD: item_pass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    networks:
      - microservices

  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      productdb:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://productdb:3306/productdb
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: product_pass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_INSTANCEID: product-service-1
    ports:
      - "8081:8081"
    networks:
      - microservices

  # Segunda instancia de product-service para demostrar balanceo de carga (Ribbon)
  product-service-2:
    build: ./product-service
    container_name: product-service-2
    depends_on:
      productdb:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://productdb:3306/productdb
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: product_pass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_INSTANCEID: product-service-2
    ports:
      - "8082:8081"
    networks:
      - microservices

  # Servidor Zuul: API Gateway con ruteo dinámico, Hystrix y balanceo de carga
  zuul-server:
    build: ./zuul-server
    container_name: zuul-server
    depends_on:
      - eureka-server
      - product-service
      - product-service-2
      - item-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8090:8090"
    networks:
      - microservices

networks:
  microservices:
    driver: bridge
